[project]
name = "repo-core"
version = "0.1.0"
description = "Reglas de las calculadoras de R.E.P.O. Solo formulas: las tablas viven en data/."
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_core"]

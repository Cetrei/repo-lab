  - {name: Rugrat, tier: 2, lift: 4, stunned: 0, health: 150, weight: 1}
  - {name: Animal, tier: 2, lift: 4, stunned: 1, health: 150, weight: 2, note: Con 2 o más jugadores se congela y deja 2 a 3 golpes.}
  - {name: Upscream, tier: 2, lift: 4, stunned: 0, health: 50, weight: 1}
  - {name: Hidden, tier: 2, lift: 4, stunned: 1, health: 100, weight: 2, note: El agarre es inconsistente.}

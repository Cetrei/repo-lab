# Fuerza para levantar cada monstruo. `lift` son las mejoras de Fuerza compradas que lista la fuente
# (null si no se puede levantar). El juego compara la fuerza interna combinada del equipo, 5 por
# jugador mas sus mejoras, con 5 mas `lift`. `stunned` es lo mismo con el monstruo aturdido.
# `weight` es la clase de peso de la wiki, de 0 (muy ligero) a 4 (muy pesado).
# `health` queda vacio cuando ninguna fuente legible lo dice, nunca se inventa.

sources:
  - name: itemlevel.net, How much strength do you need to pick up each monster
    note: Tabla principal, 1 de octubre de 2026, 29 monstruos.
  - name: Deltia's Gaming y gamerblurb, tablas de fuerza
    note: Fuerza con el monstruo aturdido y algunos valores sueltos.
  - name: R.E.P.O. wiki, Monsters y la ficha de cada monstruo
    url: https://repo-2025horror.fandom.com/wiki/Monsters
    note: Vida, tier, clase de peso y fuerza aturdido de los 30 monstruos, leidos de la tabla completa el 25 de noviembre de 2026.
  - name: pcgamer y fantime
    note: Vida de algunos monstruos.

rules:
  base_strength: 5
  max_players: 6
  # Un monstruo sin aturdir se levanta con esfuerzo cuando la fuerza del equipo llega a esta parte de la
  # necesaria sin alcanzarla. No lo da ninguna fuente: sale de lo que el dueño ve jugando. Un Rugrat activo no
  # se levanta solo con 0 ni con 1 mejora (5 y 6 de 9), y con 0,75 el mínimo queda en 7 de 9, o sea 2 mejoras.
  # El caso aturdido va aparte, con `stunned`. Ver docs/DATA_SOURCES.md.
  hard_ratio: 0.75
  # Desde esta clase de peso un monstruo es grande para los objetos que lo aturden.
  big_weight: 3

monsters:

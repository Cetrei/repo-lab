[project]
name = "repo-lab"
version = "0.1.0"
description = "Calculadoras para R.E.P.O.: cajas cosmeticas, fuerza, mejoras y aparicion de enemigos."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["repo-core", "repo-api"]

[tool.uv.workspace]
members = ["libs/repo_core", "apps/api"]

[tool.uv.sources]
repo-core = { workspace = true }
repo-api = { workspace = true }

[dependency-groups]
dev = ["ruff>=0.8", "mypy>=1.13", "types-pyyaml", "httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.32"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["libs/repo_core/src", "apps/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["libs/repo_core/src", "apps/api/src"]
explicit_package_bases = true
